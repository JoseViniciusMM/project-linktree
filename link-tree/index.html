<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8"/>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css">
    <title>link-tree</title>
  </head>
  <body>
    <div class="card">
      <div class="card-header">
        <img src="src/assets/img/fotoPerfil.png" alt="Profile Picture" class="profile-picture">
        <h1 class="name">Martines</h1>
      </div>
      <div class="card-body">
        <button class= "button"" alt="Blog Icon">
            <img class="img" src="src/assets/icons/blog.png" alt="">
            Blog
        </button>
        <button class= "button"" alt="GitLab Icon">
          <img class="img" src="src/assets/icons/gitLab.png" alt="">
            GitLab
        </button>
        <button class= "button"" alt="GitHub Icon">
          <img class="img" src="src/assets/icons/gitHub.png" alt="">
            GitHub
        </button>
        <button class= "button"" alt="LinkedIn Icon">
          <img class="img" src="src/assets/icons/linkedin.png" alt="">
            LinkedIn
        </button>
        <button class= "button"" alt="Instagram Icon">
          <img class="img" src="src/assets/icons/instagram.png" alt="">
            Instagram
        </button>
        <button class= "button"" alt="Email Icon">
          <img class="img" src="src/assets/icons/email.png" alt="">
            Enviar um e-mail
        </button>

        <div class="card-footer">
          <img src="src/assets/img/qrCode.png" alt="QR Code" class="qr-code">
        </div>
      </div>
    </div>
  </body>
</html>
