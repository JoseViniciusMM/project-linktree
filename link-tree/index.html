<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="src/style.css">
  <title>Link Tree - Martines</title>
</head>
<body>

  <main class="card">
    <header class="card-header">
      <img src="src/assets/img/fotoPerfil.png" alt="Foto de Marco Andrade" class="profile-picture">
      <h1 class="name">Martines</h1>
    </header>

    <nav class="card-body">
      <a href="#" class="button outline">
        <img class="icon" src="src/assets/icons/blog.png" alt="">
        <span>Blog</span>
      </a>

      <a href="#" class="button">
        <img class="icon" src="src/assets/icons/gitLab.png" alt="">
        <span>GitLab</span>
      </a>

      <a href="#" class="button">
        <img class="icon" src="src/assets/icons/gitHub.png" alt="">
        <span>GitHub</span>
      </a>

      <a href="#" class="button">
        <img class="icon" src="src/assets/icons/linkedin.png" alt="">
        <span>LinkedIn</span>
      </a>

      <a href="#" class="button">
        <img class="icon" src="src/assets/icons/instagram.png" alt="">
        <span>Instagram</span>
      </a>

      <a href="mailto:email@exemplo.com" class="button">
        <img class="icon" src="src/assets/icons/email.png" alt="">
        <span>Enviar um e-mail</span>
      </a>
    </nav>

    <footer class="card-footer">
      <img src="src/assets/img/qrCode.png" alt="QR Code" class="qr-code">
    </footer>
  </main>

</body>
</html>
